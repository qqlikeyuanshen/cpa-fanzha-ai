<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>反诈 AI · 登录</title><style>
:root{color-scheme:light dark;--bg:#fafafa;--card:#fff;--ink:#202123;--muted:#727579;--line:#e3e5e6;--accent:#0d8267;--bad:#b43434}@media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#222;--ink:#eee;--muted:#aaa;--line:#3b3b3b;--accent:#61ceb0;--bad:#ff9d98}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:520px;margin:60px auto;padding:24px}h1{font-size:26px;letter-spacing:-.03em}p{color:var(--muted)}form{padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--card)}label{display:block;margin:16px 0 6px;font-weight:600}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:11px;width:100%;background:var(--bg);color:var(--ink)}button{margin-top:22px;background:var(--ink);color:var(--card);cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:default}#status{white-space:pre-wrap;color:var(--accent)}#status.error{color:var(--bad)}a{color:var(--accent)}.note{font-size:12px;margin-bottom:0}input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><main><h1>反诈 AI 登录</h1><p>登录已有账号，交给 CPA 保存。不会发送短信、注册账号或重置密码。</p><form id="form" autocomplete="off"><label for="key">CPA 管理密钥</label><input id="key" type="password" autocomplete="off" required placeholder="只在当前页使用，不保存"><label for="kind">账号类型</label><select id="kind"><option value="email">邮箱</option><option value="phone">手机号</option></select><label for="account">账号</label><input id="account" type="text" autocomplete="off" spellcheck="false" required><label for="password">密码</label><input id="password" type="password" autocomplete="off" required minlength="6"><button id="submit" type="submit">登录并保存账号</button><p class="note">密码经 HTTPS 发送到本 CPA 服务，由插件按上游规则编码。密码和管理密钥不会写入账号文件；所有请求仅发送至当前页面的同源服务。</p></form><p id="status" role="status" aria-live="polite"></p><p><a href="/v0/resource/plugins/fanzha/quota">进入额度总览 →</a></p></main><script>
'use strict';(()=>{const $=id=>document.getElementById(id);const form=$('form'),button=$('submit'),status=$('status');const state=new URLSearchParams(location.search).get('state')||'';let busy=false;form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const key=$('key').value.trim();if(!key){status.textContent='请填写管理密钥';return}if(location.protocol!=='https:'){status.textContent='登录必须使用 HTTPS';status.className='error';return}busy=true;button.disabled=true;status.className='';status.textContent='正在登录…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),40000);try{const response=await fetch(new URL('/v0/management/fanzha/login',location.origin),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({kind:$('kind').value,account:$('account').value.trim(),password:$('password').value,state}),signal:controller.signal,credentials:'omit',cache:'no-store',redirect:'error'});if(response.status===401||response.status===403){$('key').value='';throw new Error('CPA 管理认证失败，已停止并清除密钥；请核对后再提交。')}let data;try{data=await response.json()}catch(_){throw new Error('接口返回非 JSON 数据，请确认插件已加载')}if(!response.ok||!data.ok)throw new Error(typeof data.error==='string'?data.error:'登录失败：HTTP '+response.status);status.textContent=data.message||'登录成功，账号已交给 CPA 保存。';$('password').value='';$('key').value='';}catch(error){status.className='error';status.textContent=error.name==='AbortError'?'请求超时，未自动重试。':error.message;}finally{clearTimeout(timer);busy=false;button.disabled=false;}})})();
</script></body></html>
