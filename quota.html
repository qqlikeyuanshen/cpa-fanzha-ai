:15px;height:15px}.text-button{border:0;background:none;min-height:28px;padding:0;color:var(--muted);font-size:12px}.privacy{margin:10px 0 0;font-size:12px;color:var(--muted)}.status{border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:20px;background:var(--surface);font-size:13px;overflow-wrap:anywhere}.status[data-kind=error]{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}.status[data-kind=success]{color:var(--accent);background:var(--good-bg)}[hidden]{display:none!important}.toolbar{align-items:center;gap:12px;margin-bottom:15px}.toolbar h2{font-size:15px;font-weight:600;margin:0}.count{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}.toolbar-actions{display:flex;gap:8px}.toolbar-actions button{min-height:36px;padding:6px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0}.card-top{gap:12px;align-items:flex-start;margin-bottom:22px}.account-info{min-width:0}.account-name{font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;margin:0 0 4px}.account-sub,.card-status{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:1px 7px;border-radius:5px;max-width:100%;overflow-wrap:anywhere}.card-refresh{min-width:36px;min-height:36px;padding:8px;flex-shrink:0}.quota-title{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}.fraction{font-variant-numeric:tabular-nums;color:var(--ink)}.progress{height:7px;background:var(--track);border-radius:10px;overflow:hidden;margin-bottom:19px}.progress-fill{height:100%;width:0;background:var(--accent);border-radius:10px;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}.stats div{min-width:0}.stats dt{font-size:11px;color:v </head>
<body>
<main>
<header class="heading">
<div><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v5c0 5 4 8 8 10 4-2 8-5 8-10V6z"/><path d="m8.5 12 2.3 2.3 4.7-4.7"/></svg><span>反诈 CPA</span></div><h1>额度总览</h1><p class="subtitle">查看每个账号的 24 小时额度。仅手动查询，不自动刷新。</p></div>
<div class="secure-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12h6M12 9v6"/><circle cx="12" cy="12" r="9"/></svg>额度查询不消耗聊天额度</div>
</header>
<section class="auth" aria-label="管理认证">
<form id="auth-form" autocomplete="off">
<label for="management-key" class="key-label">管理密钥</label>
<div class="auth-line"><input id="management-key" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="手动输入 CPA 管理密钥" aria-describedby="key-privacy" required><button id="connect" class="primary" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span id="connect-label">加载账号与额度</span></button></div>
<div class="auth-options"><label class="remember"><input id="remember" type="checkbox">仅在当前标签页记住密钥</label><button id="clear-key" type="button" class="text-button">清除密钥</button></div>
<p id="key-privacy" class="privacy">默认不存；勾选仅存 sessionStorage，恢复标签页可能恢复密钥。公共设备勿勾选。密钥只发送同源 API。</p>
</form>
</section>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<section aria-labelledby="accounts-heading">
<div class="toolbar"><h2 id="accounts-heading">账号额度<span id="account-count" class="count">尚未加载</span></h2><div class="toolbar-actions"><button id="stop" type="button" hidden>停止查询</button><button id="refresh-all" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg>刷新全部</button></div></div>
<div id="cards" class="cards"></div>
<div id="empty" class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><h3 id="empty-title">连接后查看额度</h3><p id="empty-text">输入管理密钥，加载账号与真实额度数据。</p></div>
</section>
<footer><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg><span>最多并发查询 2 个账号；认证失败即清空密钥并停止，不自动重试。重置时间仅用服务端值。</span></footer>
</main>
<template id="card-template">
<article class="card" data-state="idle" aria-busy="false">
<div class="card-top"><div class="account-info"><h3 class="account-name"></h3><div class="account-sub" hidden></div><div class="badges"><span class="badge plan">计划未提供</span><span class="badge disabled-badge" hidden>已停用</span></div></div><button type="button" class="card-refresh" title="刷新此账号"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg></button></div>
<div class="quota-title"><span>24 小时额度</span><span class="fraction">剩余比例 —</span></div>
<div class="progress is-unknown" role="progressbar" aria-label="24 小时额度剩余比例" aria-valuemin="0" aria-valuemax="100" aria-valuetext="尚未查询"><div class="progress-fill"></div></div>
<dl class="stats"><div><dt>总量</dt><dd class="limit" data-empty="true">—</dd></div><div><dt>已用</dt><dd class="used" data-empty="true">—</dd></div><div><dt>剩余</dt><dd class="remaining" data-empty="true">—</dd></div></dl>
<div class="card-status">尚未查询</div><div class="updated" hidden></div><details hidden><summary>服务端额度明细</summary><div class="detail-content"></div></details><div class="reset-note">尚未获取服务端重置时间</div>
</article>
</template>
<script>'use strict';(() => {const $ = id => document.getElementById(id);const key = $('management-key'), remember = $('remember');const store = 'fanzha.quota.management-key.v1';const records = [], requests = new Set();let seq = 0, running = false, connected = false, authFail = false;const httpOrigin = /^https?:$/.test(window.location.protocol);const apiBase = httpOrigin ? window.location.origin : null;const fmt = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 4 });class Stopped extends Error {}function notify(text, kind = 'info') {const node = $('status');node.textContent = text;node.dataset.kind = kind;node.setAttribute('role', kind === 'error' ? 'alert' : 'status');node.hidden = !text;}function forget() {try { window.sessionStorage.removeItem(store); } catch (_) {}}function save() {if (!remember.checked || !key.value.trim()) { forget(); return; }try { window.sessionStorage.setItem(store, key.value.trim()); }catch (_) {remember.checked = false;forget();notify('浏览器限制临时储存，密钥仅保留本页。', 'info');}}function controls() {const hasKey = Boolean(key.value.trim());key.disabled = running;$('connect').disabled = running || !hasKey || !httpOrigin;$('connect-label').textContent = running ? '正在查询…' : '加载账号与额度';$('refresh-all').disabled = running || !connected || !hasKey || authFail || !records.length;$('stop').hidden = !running;$('clear-key').disabled = !hasKey && !running;for (const r of records) r.button.disabled = running || !connected || !hasKey || authFail;}function state(r, state, message) {r.state = state;r.node.dataset.state = state;r.node.setAttribute('aria-busy', String(state === 'loading' || state === 'queued'));r.status.textContent = message;}function halt(message, auth = false) {seq++;running = false;for (const ctrl of requests) ctrl.abort();requests.clear();for (const r of records) {if (r.state === 'loading' || r.state === 'queued') state(r, 'error', message);}if (auth) {authFail = true;connected = false;key.value = '';remember.checked = false;forget();}contr
